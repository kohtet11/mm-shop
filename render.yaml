# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates a web service at https://mm-shop.onrender.com (stable while the service exists).
services:
  - type: web
    name: mm-shop
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: mm-shop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: NODE_VERSION
        value: "20"
      - key: DATA_ROOT
        value: /var/data
