<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-label="Game spin wheel">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="45%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="32%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="525" fill="url(#bg)"/>
  <rect width="1200" height="525" fill="url(#glow)"/>

  <!-- Wheel -->
  <g transform="translate(300,262)" filter="url(#softGlow)">
    <!-- segments: 8 colors matching shop SPIN_COLORS -->
    <path d="M0,0 L0,-190 A190,190 0 0,1 134.35,-134.35 Z" fill="#7c3aed"/>
    <path d="M0,0 L134.35,-134.35 A190,190 0 0,1 190,0 Z" fill="#a855f7"/>
    <path d="M0,0 L190,0 A190,190 0 0,1 134.35,134.35 Z" fill="#c026d3"/>
    <path d="M0,0 L134.35,134.35 A190,190 0 0,1 0,190 Z" fill="#db2777"/>
    <path d="M0,0 L0,190 A190,190 0 0,1 -134.35,134.35 Z" fill="#6366f1"/>
    <path d="M0,0 L-134.35,134.35 A190,190 0 0,1 -190,0 Z" fill="#8b5cf6"/>
    <path d="M0,0 L-190,0 A190,190 0 0,1 -134.35,-134.35 Z" fill="#ec4899"/>
    <path d="M0,0 L-134.35,-134.35 A190,190 0 0,1 0,-190 Z" fill="#4f46e5"/>
    <circle r="190" fill="none" stroke="rgba(168,85,247,0.95)" stroke-width="6"/>
    <circle r="190" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
    <!-- hub -->
    <circle r="28" fill="#0f0a1a" stroke="#c4b5fd" stroke-width="4"/>
    <text y="6" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#e9d5ff">SPIN</text>
    <!-- pointer -->
    <polygon points="0,-206 -14,-178 14,-178" fill="#f0abfc"/>
  </g>

  <!-- Copy -->
  <g transform="translate(560,155)">
    <text font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#c4b5fd" letter-spacing="0.08em">GAME</text>
    <text y="58" font-family="system-ui,sans-serif" font-size="48" font-weight="800" fill="#f3e8ff">စပင်ဘီး ကံစမ်းမည်</text>
    <text y="112" font-family="system-ui,sans-serif" font-size="22" fill="#e9d5ff">Play the spin wheel — tap to open Game</text>
    <rect y="148" width="220" height="48" rx="24" fill="#ec4899"/>
    <text x="110" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#fff">Play Game →</text>
  </g>
</svg>
